{{- if .Values.jobs.migrate.enabled }}
{{/*
One pod and no retries, so two migration runs never overlap. It connects as the
owner, on the -rw service with cnpg: it writes DDL, and the api and worker
would refuse to start as this role.
*/}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "exciter.fullname" . }}-migrate
  labels:
    {{- include "exciter.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    {{- include "exciter.hookAnnotations" (dict "helm" "post-install,pre-upgrade" "argo" "Sync" "weight" "-4") | nindent 4 }}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "exciter.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "exciter.serviceAccountName" . }}
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "exciter.image" (dict "root" $ "name" "backend") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command: ["/app/migrate", "up"]
          env:
            {{- include "exciter.passwordEnv" (dict "root" . "name" "dbOwner" "var" "DB_OWNER_PASSWORD") | nindent 12 }}
            - name: EXCITER_DB_PRIMARY_URL
              value: {{ include "exciter.dbURL" (dict "root" . "role" (include "exciter.ownerRole" .) "var" "DB_OWNER_PASSWORD" "host" (include "exciter.dbHost" .)) | quote }}
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
{{- end }}
