{{- if and .Values.s3.enabled (not .Values.seaweedfs.enabled) .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{/* Only what the chart cannot invent; the passwords are the secrets Job's. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "exciter.fullname" . }}-secrets
  labels:
    {{- include "exciter.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
type: Opaque
stringData:
  s3-access-key: {{ required "Set secrets.s3AccessKey, or name a Secret of your own in secrets.existingSecret, since s3.enabled is true." .Values.secrets.s3AccessKey | quote }}
  s3-secret-key: {{ required "Set secrets.s3SecretKey, or name a Secret of your own in secrets.existingSecret, since s3.enabled is true." .Values.secrets.s3SecretKey | quote }}
{{- end }}
