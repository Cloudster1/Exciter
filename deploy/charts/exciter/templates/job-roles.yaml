{{- if .Values.jobs.roles.enabled }}
{{/*
deploy/postgres/init-roles.sh runs from Postgres's initdb hook, which only
fires on an empty data directory and which no managed database offers. This is
the same work as a Job that can run against a database that already exists:
each CREATE ROLE is guarded, since the hook runs again on every upgrade, and
there is no replicator role, since a managed database brings its own replicas.

With cnpg the operator creates the two roles from managed.roles, and the owner
could not anyway. This Job then waits for them and only grants.
*/}}
{{- $v := .Values.database }}
{{- $roles := printf "%s, %s" $v.appRole $v.adminRole }}
{{- $owner := include "exciter.ownerRole" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "exciter.fullname" . }}-roles
  labels:
    {{- include "exciter.labels" . | nindent 4 }}
    app.kubernetes.io/component: roles
  annotations:
    # post-install, not pre-install: Helm runs pre-install hooks before the
    # release's own resources exist, a bundled database included. Argo CD runs
    # it after the database's wave is healthy and before the workloads.
    {{- include "exciter.hookAnnotations" (dict "helm" "post-install,pre-upgrade" "argo" "Sync" "weight" "-5") | nindent 4 }}
spec:
  backoffLimit: 2
  # Covers a first CNPG cluster coming up, which takes a few minutes.
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        {{- include "exciter.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: roles
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "exciter.serviceAccountName" . }}
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: roles
          image: {{ include "exciter.image" (dict "root" $ "name" "psql") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            {{- include "exciter.passwordEnv" (dict "root" . "name" "dbOwner" "var" "DB_OWNER_PASSWORD") | nindent 12 }}
            {{- if not .Values.cnpg.enabled }}
            {{- include "exciter.passwordEnv" (dict "root" . "name" "dbApp" "var" "APP_PASSWORD") | nindent 12 }}
            {{- include "exciter.passwordEnv" (dict "root" . "name" "dbAdmin" "var" "ADMIN_PASSWORD") | nindent 12 }}
            {{- end }}
            # A host that drops packets would otherwise hold a connect open
            # until the Job's deadline.
            - name: PGCONNECT_TIMEOUT
              value: "5"
            - name: PGURL
              value: {{ include "exciter.dbURL" (dict "root" . "role" $owner "var" "DB_OWNER_PASSWORD" "host" (include "exciter.dbHost" .)) | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until psql "$PGURL" -Atc "SELECT 1" >/dev/null 2>&1; do
                echo "waiting for the database to accept the owner role"
                sleep 5
              done
              {{- if .Values.cnpg.enabled }}
              until [ "$(psql "$PGURL" -Atc "SELECT count(*) FROM pg_roles WHERE rolname IN ('{{ $v.appRole }}', '{{ $v.adminRole }}')")" = 2 ]; do
                echo "waiting for the operator to create {{ $roles }}"
                sleep 5
              done
              {{- else }}
              psql -v ON_ERROR_STOP=1 "$PGURL" <<'SQL'
              -- A named tag, not $$: Kubernetes reads $$ in args as an escaped $.
              DO $roles$
              BEGIN
                  IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = {{ $v.appRole | squote }}) THEN
                      CREATE ROLE {{ $v.appRole }} LOGIN NOSUPERUSER NOBYPASSRLS;
                  END IF;
                  IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = {{ $v.adminRole | squote }}) THEN
                      CREATE ROLE {{ $v.adminRole }} LOGIN NOSUPERUSER NOBYPASSRLS;
                  END IF;
              END;
              $roles$;
              SQL
              # Outside the DO block: the passwords change between installs,
              # and ALTER is the idempotent way to say so.
              psql -v ON_ERROR_STOP=1 "$PGURL" \
                -c "ALTER ROLE {{ $v.appRole }} WITH LOGIN PASSWORD '$APP_PASSWORD'" \
                -c "ALTER ROLE {{ $v.adminRole }} WITH LOGIN PASSWORD '$ADMIN_PASSWORD'"
              psql -v ON_ERROR_STOP=1 "$PGURL" <<'SQL'
              -- The pool reads pg_stat_wal_receiver to tell a caught up standby
              -- from one whose receiver has quietly dropped.
              GRANT pg_read_all_stats TO {{ $roles }};
              SQL
              {{- end }}
              psql -v ON_ERROR_STOP=1 "$PGURL" <<'SQL'
              GRANT CONNECT ON DATABASE {{ $v.name }} TO {{ $roles }};
              SQL
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
{{- end }}
