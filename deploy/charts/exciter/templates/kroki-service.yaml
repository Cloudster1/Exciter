{{- if .Values.kroki.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "exciter.fullname" . }}-kroki
  labels:
    {{- include "exciter.labels" . | nindent 4 }}
    app.kubernetes.io/component: kroki
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8000
      targetPort: http
  selector:
    {{- include "exciter.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: kroki
{{- end }}
