apiVersion: v1
kind: Service
metadata:
  name: {{ include "exciter.fullname" . }}-api
  labels:
    {{- include "exciter.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
    # /metrics has no authentication of its own: on the Service for a scraper
    # inside the cluster, and nowhere in the Ingress.
    - name: metrics
      port: {{ .Values.telemetry.metricsPort }}
      targetPort: metrics
  selector:
    {{- include "exciter.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
