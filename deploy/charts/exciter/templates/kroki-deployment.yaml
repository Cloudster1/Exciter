{{- if .Values.kroki.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "exciter.fullname" . }}-kroki
  labels:
    {{- include "exciter.labels" . | nindent 4 }}
    app.kubernetes.io/component: kroki
spec:
  replicas: {{ .Values.kroki.replicas }}
  selector:
    matchLabels:
      {{- include "exciter.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: kroki
  template:
    metadata:
      labels:
        {{- include "exciter.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: kroki
      {{- with .Values.kroki.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "exciter.serviceAccountName" . }}
      {{- with .Values.images.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The image's own user, named rather than numbered there, so runAsNonRoot can check it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: kroki
          image: {{ include "exciter.image" (dict "root" $ "name" "kroki") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            # The image's default, set so a later image cannot loosen it: no file read, no address fetched.
            - name: KROKI_SAFE_MODE
              value: secure
            # The JVM and the renderers write scratch files only under /tmp.
            - name: HOME
              value: /tmp
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.kroki.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.kroki.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kroki.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kroki.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
