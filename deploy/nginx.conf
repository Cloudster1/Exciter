server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The api resolves by service name at request time, so nginx survives the api container being recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;

    # The API shares the app's origin, so the session cookie is first-party and no CORS is involved; its
    # answers carry the api's own security headers, which are stricter than the app's.
    location /api/ {
        # The api decides how large a request may be; nginx does not second-guess it.
        client_max_body_size 0;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The probes sit outside /api/; passing them through lets a health check see the whole chain.
    location = /healthz {
        proxy_pass $api;
    }
    location = /readyz {
        proxy_pass $api;
    }

    # nginx's type table has no entry for a web app manifest, which would be served as an anonymous download.
    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    # The security headers repeat in both static locations, since an add_header in a location drops the inherited
    # ones. Hashed assets never change under one name; one header, so Cache-Control is not sent twice.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # Client side routing: unknown paths are app routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
    }
}
