# Installs the Helm chart into a throwaway kind cluster and upgrades it. Apart
# from CI because it is slow and only a change to what the chart installs can
# break it. See scripts/chart-install-test.sh and docs/decisions.md.
name: Chart install

on:
  # What the images are built from and what decides whether the pods start: the entry points the chart runs, the
  # configuration they load, the schema, the web and render images, and the test itself. tests/test-ci.sh checks
  # that both lists cover the Dockerfiles' sources.
  pull_request:
    paths:
      - deploy/**
      - VERSION
      - api/**
      - backend/go.mod
      - backend/go.sum
      - backend/cmd/api/**
      - backend/cmd/worker/**
      - backend/cmd/seed/**
      - backend/cmd/migrate/**
      - backend/internal/config/**
      - backend/migrations/**
      - render/**
      - web/**
      - scripts/chart-install-*
      - scripts/build-stamp.sh
      - scripts/kind/**
      - mk/helm.mk
      - mk/kind.mk
      - .github/workflows/chart-install.yml
  push:
    branches: [main]
    paths:
      - deploy/**
      - VERSION
      - api/**
      - backend/go.mod
      - backend/go.sum
      - backend/cmd/api/**
      - backend/cmd/worker/**
      - backend/cmd/seed/**
      - backend/cmd/migrate/**
      - backend/internal/config/**
      - backend/migrations/**
      - render/**
      - web/**
      - scripts/chart-install-*
      - scripts/build-stamp.sh
      - scripts/kind/**
      - mk/helm.mk
      - mk/kind.mk
      - .github/workflows/chart-install.yml
  workflow_dispatch:

concurrency:
  group: chart-install-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    name: install and upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: make test-chart-install
