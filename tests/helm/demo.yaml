# Source: exciter/templates/job-secrets.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: r-exciter-secrets-generator
  labels:
    helm.sh/chart: exciter-0.1.0
    app.kubernetes.io/name: exciter
    app.kubernetes.io/instance: r
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: exciter
    app.kubernetes.io/component: secrets
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-30"
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: exciter
        app.kubernetes.io/instance: r
        app.kubernetes.io/component: secrets
    spec:
      restartPolicy: Never
      serviceAccountName: r-exciter-secrets-generator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: secrets
          image: alpine/kubectl:1.34.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          env:
            # kubectl keeps its discovery cache under HOME.
            - name: HOME
              value: /tmp
          command: ["/bin/sh", "-ec"]
          args:
            - |
              ns="default"

              # Any lookup failure but NotFound stops the Job: read as absent,
              # it would try to create a Secret that may well exist.
              exists() {
                if out=$(kubectl get secret "$1" -n "$ns" -o name 2>&1); then return 0; fi
                case "$out" in *NotFound*) return 1 ;; esac
                echo "$out" >&2
                exit 1
              }

              password() {
                tr -dc A-Za-z0-9 </dev/urandom | head -c 32
              }

              # EXCITER_SECRET_KEY is 32 random bytes in base64, not a password.
              key() {
                head -c 32 /dev/urandom | base64 | tr -d '\n'
              }

              # Labelled as Exciter's without being Helm's, so an uninstall
              # keeps it. cnpg.io/reload has the operator apply a change.
              create() {
                kubectl create secret generic "$1" -n "$ns" \
                  --type=kubernetes.io/basic-auth \
                  --from-literal=username="$2" \
                  --from-literal=password="$3" \
                  --dry-run=client -o yaml \
                | kubectl label --local -f - -o yaml \
                    app.kubernetes.io/part-of=exciter \
                    app.kubernetes.io/instance="r" \
                    cnpg.io/reload=true \
                | kubectl create -f - 2>err || {
                  grep -q AlreadyExists err && return 0
                  cat err >&2
                  exit 1
                }
                echo "created $1 with a random password"
              }
              cd /tmp
              if exists "r-exciter-db-app"; then
                echo "r-exciter-db-app exists and is left as it is"
              else
                create "r-exciter-db-app" "exciter_app" "$(password)"
              fi
              if exists "r-exciter-db-admin"; then
                echo "r-exciter-db-admin exists and is left as it is"
              else
                create "r-exciter-db-admin" "exciter_admin" "$(password)"
              fi
              if exists "r-exciter-db-owner"; then
                echo "r-exciter-db-owner exists and is left as it is"
              else
                create "r-exciter-db-owner" "postgres" "$(password)"
              fi
              if exists "r-exciter-secret-key"; then
                echo "r-exciter-secret-key exists and is left as it is"
              else
                create "r-exciter-secret-key" "exciter" "$(key)"
              fi
              if exists "r-exciter-bootstrap-admin"; then
                echo "r-exciter-bootstrap-admin exists and is left as it is"
              else
                create "r-exciter-bootstrap-admin" "admin@exciter.localhost" "$(password)"
              fi
              if exists "exciter-s3"; then
                echo "exciter-s3 exists and is left as it is"
              else
                create "exciter-s3" "exciter" "$(password)"
              fi
              if exists "exciter-s3-read"; then
                echo "exciter-s3-read exists and is left as it is"
              else
                create "exciter-s3-read" "exciter-read" "$(password)"
              fi
              if exists "r-exciter-valkey"; then
                echo "r-exciter-valkey exists and is left as it is"
              else
                create "r-exciter-valkey" "default" "$(password)"
              fi
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
