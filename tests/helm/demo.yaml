# Source: exciter/templates/configmap-nginx.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: r-exciter-nginx
  labels:
    helm.sh/chart: exciter-0.1.0
    app.kubernetes.io/name: exciter
    app.kubernetes.io/instance: r
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: exciter
data:
  default.conf: |
    # Connections to the api are kept and reused: one per request runs out of
    # local ports at a few hundred requests a second. The Service's address
    # does not change, so it is resolved once at start.
    upstream exciter_api {
        server r-exciter-api:8080;
        keepalive 64;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # A kept connection needs HTTP/1.1 and no "Connection: close".
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/ {
            # The api decides how large an upload may be.
            client_max_body_size 0;
            proxy_pass http://exciter_api;
        }
        # The OAuth metadata sits at the root, where the RFCs put it, and the api answers it (#188).
        location ^~ /.well-known/oauth- {
            proxy_pass http://exciter_api;
        }
        location = /healthz {
            proxy_pass http://exciter_api;
        }
        location = /readyz {
            proxy_pass http://exciter_api;
        }

        # nginx's type table has no entry for a web app manifest, which would be
        # served as an anonymous download. No add_header here, so the server's
        # own headers still apply.
        location = /site.webmanifest {
            default_type application/manifest+json;
        }
        # The headers are repeated per location because an add_header inside
        # one drops every header inherited from the server.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "same-origin" always;
        }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Referrer-Policy "same-origin" always;
        }
    }
