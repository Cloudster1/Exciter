# Source: exciter/templates/job-roles.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: r-exciter-roles
  labels:
    helm.sh/chart: exciter-0.1.0
    app.kubernetes.io/name: exciter
    app.kubernetes.io/instance: r
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: exciter
    app.kubernetes.io/component: roles
  annotations:
    # post-install, not pre-install: Helm runs pre-install hooks before the
    # release's own resources exist, a bundled database included. Argo CD runs
    # it after the database's wave is healthy and before the workloads.
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-5"
spec:
  backoffLimit: 2
  # Covers a first CNPG cluster coming up, which takes a few minutes.
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: exciter
        app.kubernetes.io/instance: r
        app.kubernetes.io/component: roles
    spec:
      restartPolicy: Never
      serviceAccountName: r-exciter
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: roles
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          env:
            - name: DB_OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: r-exciter-db-owner
                  key: password
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: r-exciter-db-app
                  key: password
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: r-exciter-db-admin
                  key: password
            # A host that drops packets would otherwise hold a connect open
            # until the Job's deadline.
            - name: PGCONNECT_TIMEOUT
              value: "5"
            - name: PGURL
              value: "postgres://postgres:$(DB_OWNER_PASSWORD)@r-exciter-postgresql:5432/exciter?sslmode=disable"
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until psql "$PGURL" -Atc "SELECT 1" >/dev/null 2>&1; do
                echo "waiting for the database to accept the owner role"
                sleep 5
              done
              psql -v ON_ERROR_STOP=1 "$PGURL" <<'SQL'
              -- A named tag, not $$: Kubernetes reads $$ in args as an escaped $.
              DO $roles$
              BEGIN
                  IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'exciter_app') THEN
                      CREATE ROLE exciter_app LOGIN NOSUPERUSER NOBYPASSRLS;
                  END IF;
                  IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'exciter_admin') THEN
                      CREATE ROLE exciter_admin LOGIN NOSUPERUSER NOBYPASSRLS;
                  END IF;
              END;
              $roles$;
              SQL
              # Outside the DO block: the passwords change between installs,
              # and ALTER is the idempotent way to say so.
              psql -v ON_ERROR_STOP=1 "$PGURL" \
                -c "ALTER ROLE exciter_app WITH LOGIN PASSWORD '$APP_PASSWORD'" \
                -c "ALTER ROLE exciter_admin WITH LOGIN PASSWORD '$ADMIN_PASSWORD'"
              psql -v ON_ERROR_STOP=1 "$PGURL" <<'SQL'
              -- The pool reads pg_stat_wal_receiver to tell a caught up standby
              -- from one whose receiver has quietly dropped.
              GRANT pg_read_all_stats TO exciter_app, exciter_admin;
              SQL
              psql -v ON_ERROR_STOP=1 "$PGURL" <<'SQL'
              GRANT CONNECT ON DATABASE exciter TO exciter_app, exciter_admin;
              SQL
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
