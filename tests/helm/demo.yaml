apiVersion: apps/v1
kind: Deployment
metadata:
  name: r-seaweedfs-s3
  namespace: default
  labels:
    app.kubernetes.io/name: seaweedfs
    helm.sh/chart: seaweedfs-4.46.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: r
    app.kubernetes.io/component: s3
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
      app.kubernetes.io/instance: r
      app.kubernetes.io/component: s3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
        helm.sh/chart: seaweedfs-4.46.0
        app.kubernetes.io/instance: r
        app.kubernetes.io/component: s3
      
      annotations:
      
    spec:
      restartPolicy: Always
      
      terminationGracePeriodSeconds: 10
      enableServiceLinks: false
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.46
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SEAWEEDFS_FULLNAME
              value: "r-seaweedfs"
            
            - name: SEAWEEDFS_S3_ADMIN_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: "exciter-s3"
                  key: "username"
            - name: SEAWEEDFS_S3_ADMIN_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: "exciter-s3"
                  key: "password"
            - name: SEAWEEDFS_S3_READ_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: "exciter-s3-read"
                  key: "username"
            - name: SEAWEEDFS_S3_READ_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: "exciter-s3-read"
                  key: "password"

            - name: WEED_CLUSTER_DEFAULT
              value: "sw"
            - name: WEED_CLUSTER_SW_FILER
              value: "r-seaweedfs-filer-client.default:8888"
            - name: WEED_CLUSTER_SW_MASTER
              value: "r-seaweedfs-master.default:9333"
          command:
            - "/bin/sh"
            - "-ec"
            - |
              exec /usr/bin/weed \
              -logdir=/logs \
              -v=1 \
              s3 \
              -ip.bind=0.0.0.0 \
              -port=8333 \
              -metricsPort 9327 \
              -config=/etc/sw/seaweedfs_s3_config \
              -filer=r-seaweedfs-filer-client.default:8888 \
              -port.lance=9101 \
          volumeMounts:
            - name: logs
              mountPath: "/logs/"
            - mountPath: /etc/sw
              name: config-users
              readOnly: true
            
          ports:
            - containerPort: 8333
              name: swfs-s3
            - containerPort: 9101
              name: swfs-lance
            - containerPort: 9327
              name: metrics
          readinessProbe:
            httpGet:
              path: /status
              port: 8333
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 15
            successThreshold: 1
            failureThreshold: 100
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /status
              port: 8333
              scheme: HTTP
            initialDelaySeconds: 20
            periodSeconds: 60
            successThreshold: 1
            failureThreshold: 20
            timeoutSeconds: 10
      volumes:
        - name: config-users
          secret:
            defaultMode: 420
            secretName: r-seaweedfs-s3-secret
        - name: logs
          hostPath:
            path: /storage/logs/seaweedfs/s3
            type: DirectoryOrCreate
