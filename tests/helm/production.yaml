apiVersion: apps/v1
kind: Deployment
metadata:
  name: r-exciter-api
  labels:
    helm.sh/chart: exciter-0.1.0
    app.kubernetes.io/name: exciter
    app.kubernetes.io/instance: r
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: exciter
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: exciter
      app.kubernetes.io/instance: r
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: exciter
        app.kubernetes.io/instance: r
        app.kubernetes.io/component: api
      annotations:
        # Rolls the pods when the configuration changes, which an edited
        # ConfigMap alone would not.
        checksum/env: 5c00bfbe7b0dc0cb49c2899420c5b3befdf0a779aeac62664068ec8241be3081
    spec:
      serviceAccountName: r-exciter
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 40
      containers:
        - name: api
          image: ghcr.io/cloudster1/exciter-backend:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          command: ["/app/api"]
          envFrom:
            - configMapRef:
                name: r-exciter-env
          env:
            - name: DB_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: r-exciter-db-app
                  key: password
            - name: DB_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: r-exciter-db-admin
                  key: password
            - name: EXCITER_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: r-exciter-secret-key
                  key: password
            - name: EXCITER_DB_PRIMARY_URL
              value: "postgres://exciter_app:$(DB_APP_PASSWORD)@r-exciter-postgres-rw:5432/exciter?sslmode=require"
            - name: EXCITER_DB_ADMIN_URL
              value: "postgres://exciter_admin:$(DB_ADMIN_PASSWORD)@r-exciter-postgres-rw:5432/exciter?sslmode=require"
            - name: EXCITER_DB_REPLICA_URLS
              value: "postgres://exciter_app:$(DB_APP_PASSWORD)@r-exciter-postgres-ro:5432/exciter?sslmode=require"
            - name: EXCITER_VALKEY_URL
              value: "redis://valkey.example:6379/0"
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          # /healthz touches nothing downstream, so a database outage does not
          # get every pod killed and restarted into it.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          # /readyz pings the primary, so a pod that cannot reach it leaves the
          # Service until it can.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 3
            failureThreshold: 30
          resources:
            limits:
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
