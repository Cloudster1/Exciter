apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: r-exciter
  labels:
    helm.sh/chart: exciter-0.1.0
    app.kubernetes.io/name: exciter
    app.kubernetes.io/instance: r
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: exciter
spec:
  tls:
    - hosts:
        - "exciter.example.com"
      secretName: exciter-tls
  rules:
    - host: "exciter.example.com"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: r-exciter-api
                port:
                  name: http
          # The OAuth metadata sits at the root, where the RFCs put it (#188).
          - path: /.well-known/oauth-authorization-server
            pathType: Prefix
            backend:
              service:
                name: r-exciter-api
                port:
                  name: http
          - path: /.well-known/oauth-protected-resource
            pathType: Prefix
            backend:
              service:
                name: r-exciter-api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: r-exciter-web
                port:
                  name: http
