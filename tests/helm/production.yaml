# Source: exciter/templates/job-roles.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: r-exciter-roles
  labels:
    helm.sh/chart: exciter-0.1.0
    app.kubernetes.io/name: exciter
    app.kubernetes.io/instance: r
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: exciter
    app.kubernetes.io/component: roles
  annotations:
    # post-install, not pre-install: Helm runs pre-install hooks before the
    # release's own resources exist, a bundled database included. Argo CD runs
    # it after the database's wave is healthy and before the workloads.
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-5"
spec:
  backoffLimit: 2
  # Covers a first CNPG cluster coming up, which takes a few minutes.
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: exciter
        app.kubernetes.io/instance: r
        app.kubernetes.io/component: roles
    spec:
      restartPolicy: Never
      serviceAccountName: r-exciter
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: roles
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          env:
            - name: DB_OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: r-exciter-db-owner
                  key: password
            # A host that drops packets would otherwise hold a connect open
            # until the Job's deadline.
            - name: PGCONNECT_TIMEOUT
              value: "5"
            - name: PGURL
              value: "postgres://exciter_owner:$(DB_OWNER_PASSWORD)@r-exciter-postgres-rw:5432/exciter?sslmode=require"
          command: ["/bin/sh", "-ec"]
          args:
            - |
              until psql "$PGURL" -Atc "SELECT 1" >/dev/null 2>&1; do
                echo "waiting for the database to accept the owner role"
                sleep 5
              done
              until [ "$(psql "$PGURL" -Atc "SELECT count(*) FROM pg_roles WHERE rolname IN ('exciter_app', 'exciter_admin')")" = 2 ]; do
                echo "waiting for the operator to create exciter_app, exciter_admin"
                sleep 5
              done
              psql -v ON_ERROR_STOP=1 "$PGURL" <<'SQL'
              GRANT CONNECT ON DATABASE exciter TO exciter_app, exciter_admin;
              SQL
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
