apiVersion: apps/v1
kind: Deployment
metadata:
  name: r-exciter-kroki
  labels:
    helm.sh/chart: exciter-0.1.0
    app.kubernetes.io/name: exciter
    app.kubernetes.io/instance: r
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: exciter
    app.kubernetes.io/component: kroki
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: exciter
      app.kubernetes.io/instance: r
      app.kubernetes.io/component: kroki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: exciter
        app.kubernetes.io/instance: r
        app.kubernetes.io/component: kroki
    spec:
      serviceAccountName: r-exciter
      # The image's own user, named rather than numbered there, so runAsNonRoot can check it.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: kroki
          image: yuzutech/kroki:0.33.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          env:
            # The image's default, set so a later image cannot loosen it: no file read, no address fetched.
            - name: KROKI_SAFE_MODE
              value: secure
            # The JVM and the renderers write scratch files only under /tmp.
            - name: HOME
              value: /tmp
          ports:
            - name: http
              containerPort: 8000
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 384Mi
      volumes:
        - name: tmp
          emptyDir: {}
